<body>
    <h1>와인의 시음 방법</h1>

    <h2>와인을 좀 더 맛있게 마시는 방법</h2>
    <p><ol><li>와인에 <strong>알맞은</strong> 잔을 선택한다.</li>
    <li>와인을 <strong>알맞은</strong> 온도로 마신다.</li>
    <li>필요하면 <strong>디펜더<sub>와인 병 속에 담긴 와인을 옮겨 먹는 투명한 유리병</sub></strong>에 따라 마신다.</li>
</ol></p>

<h2>와인 품종에 따른 글래스 선택</h2>
<p>
    <dl><em>리즐링 글래스</em>
    <dd>글래스의 입구가 넓게 퍼지지 않은 잔으로 와인이 입속으로 부드럽게 들어 가도록 해 준다. <br>이 잔에 마시는 와인은 </dd></dl>
  <em>시도네 글래스</em>
  <em>버건디 글래스</em>
  
</p>


</body>
</html>
